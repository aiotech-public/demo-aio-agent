stream {
  upstream aio-agent {
    server 172.30.0.10:7200 max_fails=0 fail_timeout=0;
  }

  upstream aio-agent-tls {
    server 172.30.0.10:7201 max_fails=0 fail_timeout=0;
  }

## Stream plain traffic
  server {
    listen 80;
    listen [::]:80;
    proxy_pass aio-agent;
    proxy_protocol on;
  }

## Stream TLS traffic
  server {
    listen 443;
    listen [::]:443;
    proxy_pass aio-agent-tls;
    proxy_protocol on;
  }
}
